services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://vendor:${POSTGRES_PASSWORD}@db:5432/vendor_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vendor_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor -d vendor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
